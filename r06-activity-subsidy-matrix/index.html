<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>煌上煌5门店 r06_活动类型×平台补贴矩阵</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:PingFang SC,Microsoft YaHei,sans-serif;background:#f5f6fa;color:#2c3e50;line-height:1.7}
.header{background:linear-gradient(135deg,#1a2980 0%,#26d0ce 100%);color:#fff;padding:36px 24px;text-align:center}
.header h1{font-size:1.9em;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.header .sub{font-size:1em;opacity:.92;margin-top:6px}
.header .meta{margin-top:8px;font-size:.8em;opacity:.7}
.container{max-width:1300px;margin:0 auto;padding:20px}
.section{margin-bottom:26px}
.section-title{font-size:1.3em;font-weight:700;color:#1a2980;border-left:5px solid #26d0ce;padding-left:14px;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:14px}
.card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.card .label{font-size:.76em;color:#7f8c8d}
.card .value{font-size:1.45em;font-weight:700;color:#1a2980}
.card .sub{font-size:.72em;color:#95a5a6}
.card .value.green{color:#27ae60}.card .value.red{color:#e74c3c}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(450px,1fr));gap:16px}
.chart-box{background:#fff;border-radius:10px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.chart-box h3{font-size:.95em;margin-bottom:10px;color:#34495e}
.chart-box canvas{max-height:330px}
.table-wrap{overflow-x:auto;background:#fff;border-radius:10px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.05);margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:.82em}
th{background:#f8f9fa;padding:10px 8px;text-align:left;font-weight:600;border-bottom:3px solid #26d0ce;white-space:nowrap}
td{padding:8px;border-bottom:1px solid #eee}
tr:hover td{background:#f0fbfb}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.76em;font-weight:600}
.b-red{background:#fde8e8;color:#c0392b}.b-green{background:#def7ec;color:#046c4e}
.b-blue{background:#e1effe;color:#1e429f}.b-orange{background:#fef3c7;color:#92400f}
.insight{background:linear-gradient(135deg,#f0fbfb,#f5f8ff);border:1px solid #c9e8e8;border-radius:10px;padding:14px 18px;margin-bottom:12px}
.insight h4{color:#1a2980;margin-bottom:6px}
.insight ul{margin-left:18px}.insight li{margin-bottom:3px;color:#555}
.footer{text-align:center;padding:26px;color:#888;font-size:.78em}
@media(max-width:768px){.grid2{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="header">
<h1>煌上煌5门店 r06_活动类型×平台补贴矩阵</h1>
<div class="sub">r06_活动类型×平台补贴矩阵 | 各活动类型在美团/淘宝的实际补贴</div>
<div class="meta">路径3 活动明细62,320条</div>
</div>
<div class="container">
<div class="section"><div class="section-title"><span class="num">6</span>核心指标</div><div class="cards"></div></div><div class="section"><div class="section-title"><span class="num">6</span>可视化分析</div><div class="grid2"><div class="chart-box"><h3>图表1</h3><canvas id="c1"></canvas></div><div class="chart-box"><h3>图表2</h3><canvas id="c2"></canvas></div></div></div>
<div class="footer">煌上煌5门店外卖数据分析系列（6/10）| 数据源：外卖数据/订单明细/活动明细/广告（5-7月）| 生成 2026-08-14 | 全部自我计算</div>
</div>
<script>
Chart.register(ChartDataLabels);
const fmt = v => '¥' + Number(v).toLocaleString('zh-CN', {maximumFractionDigits: 0});

new Chart(document.getElementById('c1'), {
  type:'bar',
  data:{labels:["减配送费", "商品折扣/特价", "商家代金券", "平台津贴", "店铺满减", "支付红包", "门店新客立减"],datasets:[{label:'美团',data:[29632.88, 17676.33, 2229.0, 1444.9, 12371.2, 130034.29, 3049.0],backgroundColor:'#FFD100',borderRadius:4},{label:'淘宝闪购',data:[28152.3, 36608.71, 83.2, 0, 8298.0, 128135.51, 2004.0],backgroundColor:'#FF5000',borderRadius:4}]},
  options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{datalabels:{display:'auto',color:'#333',formatter:v=>v>5000?fmt(v):''}},scales:{x:{stacked:true,title:{display:true,text:'实际补贴(元)'}},y:{stacked:true}}}
});

</script>
</body>
</html>
