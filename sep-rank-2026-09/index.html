    if(kw){ var s = (r[0]+r[1]+r[2]+r[3]).toLowerCase(); if(s.indexOf(kw) < 0) return false; }
    return true;
  });
  arr.sort(function(a,b){ return val(b,plat,sortKey) - val(a,plat,sortKey); });
  return arr;
}
function cards(arr){
  var o = 0, p = 0, so = 0, sp = 0, jo = 0, jp = 0, to = 0, tp = 0;
  arr.forEach(function(r){
    o += val(r,plat,"o"); p += val(r,plat,"p");
    so += r[4]; sp += r[5]; jo += r[6]; jp += r[7]; to += r[8]; tp += r[9];
  });
  var h = "";
  h += '<div class="card"><div class="k">订单合计</div><div class="v">' + fo(o) + '</div><div class="s">当前筛选 ' + arr.length + ' 家门店</div></div>';
  h += '<div class="card"><div class="k">实付合计</div><div class="v">' + fm(p) + '</div><div class="s">单均 ' + fm(p/Math.max(o,1)) + '</div></div>';
  if(plat === "all"){
    h += '<div class="card"><div class="k">美团</div><div class="v ty">' + fo(so) + '</div><div class="s">' + fm(sp) + '</div></div>';
    h += '<div class="card"><div class="k">淘宝闪购</div><div class="v ta">' + fo(jo) + '</div><div class="s">' + fm(jp) + '</div></div>';
    h += '<div class="card"><div class="k">京东秒送</div><div class="v jd">' + fo(to) + '</div><div class="s">' + fm(tp) + '</div></div>';
  }
  document.getElementById("cards").innerHTML = h;
}
function render(){
  var arr = calc();
  cards(arr);
  var body = document.getElementById("tb"), h = "", n = Math.min(limit, arr.length);
  var totO = arr.reduce(function(s,r){ return s + val(r,plat,"o"); }, 0);
  var totP = arr.reduce(function(s,r){ return s + val(r,plat,"p"); }, 0);
  var cO = 0, cP = 0, rkO = 0, rkP = 0;
  for(var i=0;i<n;i++){
    var r = arr[i];
    var vo = val(r,plat,"o"), vp = val(r,plat,"p");
    rkO = (vo === cO) ? rkO : i+1; rkP = rkP + 1; cO = vo;
    var c = function(v, cls){ return v > 0 ? '<td class="' + cls + '">' + (cls === "ty" || cls === "ta" || cls === "jd" ? fo(v) : fo(v)) + '</td>' : '<td class="z">—</td>'; };
    h += '<tr>';
    h += '<td class="l rk">' + (sortKey === "o" ? rkO : rkP) + '</td>';
    h += '<td class="l">' + r[0] + '</td><td class="l"><span class="tag">' + (r[1] || "—") + '</span></td>';
    h += '<td class="l" style="color:#7f93b5">' + (r[2] || "—") + '</td>';
    h += '<td class="l nm" title="' + r[3] + '">' + r[3] + '</td>';
    h += c(r[4],"ty") + '<td class="ty">' + (r[5] > 0 ? fm(r[5]) : '<span class="z">—</span>') + '</td>';
    h += c(r[6],"ta") + '<td class="ta">' + (r[7] > 0 ? fm(r[7]) : '<span class="z">—</span>') + '</td>';
    h += c(r[8],"jd") + '<td class="jd">' + (r[9] > 0 ? fm(r[9]) : '<span class="z">—</span>') + '</td>';
    h += '<td class="tt">' + fo(r[4]+r[6]+r[8]) + '</td><td class="tt">' + fm(r[5]+r[7]+r[9]) + '</td>';
    h += '</tr>';
  }
  body.innerHTML = h;
  document.getElementById("more").textContent = arr.length > limit ? ('显示全部（共 ' + arr.length + ' 家）') : '已显示全部 ' + arr.length + ' 家';
  document.getElementById("hint").textContent = 'TOP' + Math.min(limit, arr.length) + ' 合计 ' + fo(totO) + ' 单 / ' + fm(totP) + '，占 ' + ((totO/Math.max(1,val({4:0},plat,"o")===0?1:1)) ? (100*totO/Math.max(1, arr.reduce(function(s,r){return s+val(r,plat,"o");},0)|0)) : 0).toFixed(0) + '%';
  document.getElementById("hint").textContent = '共 ' + arr.length + ' 家门店｜TOP' + n + ' 合计 ' + fo(totO) + ' 单 / ' + fm(totP);
}
document.getElementById("plat").addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  [].forEach.call(this.children, function(x){ x.classList.remove("on"); });
  b.classList.add("on"); plat = b.dataset.p; limit = 100; render();
});
document.getElementById("sortby").addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  [].forEach.call(this.children, function(x){ x.classList.remove("on"); });
  b.classList.add("on"); sortKey = b.dataset.s; render();
});
document.getElementById("q").addEventListener("input", function(){ kw = this.value.trim().toLowerCase(); limit = 100; render(); });
document.getElementById("more").addEventListener("click", function(){ limit = 1e9; render(); });
document.getElementById("foot").innerHTML = '数据缺口：淘宝有 25.5%（21,780 单）未匹配到 C 编码，已单列「未匹配主档」行；「地铁万科店 C12682」与「地铁万科广场店 C14793」为主档两条记录，其淘宝/美团口径可能拆分；京东体量小（全月 8,501 单），单量榜参考性弱。<br>数据源：美团外卖 + 淘宝闪购 + 京东秒送 月度导出｜生成日期：2026-10-19';
render();
</script></body></html>
